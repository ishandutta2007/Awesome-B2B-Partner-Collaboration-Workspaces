<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .gradient-title {
        fill: url(#accentGrad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .node-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #38bdf8;
      }

      /* Dynamic Animations in Background and Decorative Accents */
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(40px, -25px) scale(1.1); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-30px, 20px) scale(1.15); }
      }
      @keyframes pulseBeam {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.8; }
        50% { stroke-dashoffset: -40; opacity: 0.3; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes signalRing {
        0% { r: 6px; opacity: 0.9; }
        100% { r: 24px; opacity: 0; }
      }

      .floating-orb-1 {
        animation: floatOrb1 9s ease-in-out infinite;
      }
      .floating-orb-2 {
        animation: floatOrb2 11s ease-in-out infinite;
      }
      .dynamic-beam {
        stroke-dasharray: 8, 8;
        animation: pulseBeam 4s linear infinite;
      }
      .radar-arm {
        transform-origin: 1050px 140px;
        animation: radarSweep 8s linear infinite;
      }
      .pulsing-ring {
        animation: signalRing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .pulsing-ring-delay {
        animation: signalRing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 1.25s;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs (Background layer) -->
  <g class="floating-orb-1">
    <circle cx="200" cy="100" r="180" fill="url(#glowGrad1)" />
  </g>
  <g class="floating-orb-2">
    <circle cx="1020" cy="300" r="220" fill="url(#glowGrad2)" />
  </g>

  <!-- Architectural Grid Backdrop -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Interactive Network & Nodes Topology (Background decorative aspect) -->
  <g opacity="0.65">
    <!-- Connecting Datapath Beams -->
    <path d="M 860 120 L 980 80 L 1080 160 L 990 260 L 860 120" fill="none" stroke="#334155" stroke-width="2" />
    <path d="M 980 80 L 990 260" fill="none" stroke="#334155" stroke-width="1.5" />
    
    <!-- Animated Flow Lines -->
    <path d="M 860 120 L 980 80" fill="none" stroke="#38bdf8" stroke-width="2" class="dynamic-beam" />
    <path d="M 980 80 L 1080 160" fill="none" stroke="#818cf8" stroke-width="2" class="dynamic-beam" />
    <path d="M 1080 160 L 990 260" fill="none" stroke="#c084fc" stroke-width="2" class="dynamic-beam" />
    
    <!-- Node Radar / Activity Indicator -->
    <circle cx="1080" cy="160" r="6" fill="#38bdf8" />
    <circle cx="1080" cy="160" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" class="pulsing-ring" />
    <circle cx="1080" cy="160" r="12" fill="none" stroke="#818cf8" stroke-width="1.5" class="pulsing-ring-delay" />

    <circle cx="860" cy="120" r="5" fill="#818cf8" />
    <circle cx="980" cy="80" r="5" fill="#38bdf8" />
    <circle cx="990" cy="260" r="5" fill="#c084fc" />

    <!-- Node labels -->
    <rect x="805" y="132" width="110" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="860" y="148" text-anchor="middle" class="node-text">Partner Org</text>

    <rect x="925" y="44" width="110" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="980" y="60" text-anchor="middle" class="node-text">Secure VDR</text>

    <rect x="1035" y="180" width="100" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="1085" y="196" text-anchor="middle" class="node-text" fill="#38bdf8">Portal Hub</text>

    <rect x="935" y="275" width="110" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="990" y="291" text-anchor="middle" class="node-text">Enterprise API</text>
  </g>

  <!-- FOREGROUND LAYER: Badges, Title, Subtitle, Feature Pills (Strictly elevated, crystal clear) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 75)">
      <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8" />
      <text x="30" y="21" class="tag-text" fill="#38bdf8">CURATED AWESOME DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title-text">
      Awesome <tspan class="gradient-title">B2B Partner Collaboration</tspan>
    </text>
    <text x="0" y="215" class="title-text">
      Workspaces &amp; Client Portals
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="260" class="subtitle-text">
      The definitive index of external collaboration spaces, shared channel platforms,
    </text>
    <text x="0" y="286" class="subtitle-text">
      and self-hosted open-source client portal software.
    </text>

    <!-- Bottom Feature Badges / Pills -->
    <g transform="translate(0, 325)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="20" cy="18" r="5" fill="#10b981" />
        <text x="34" y="23" class="tag-text">SaaS Market Cap</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(185, 0)">
        <rect width="180" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="20" cy="18" r="5" fill="#38bdf8" />
        <text x="34" y="23" class="tag-text">Transparent Pricing</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(380, 0)">
        <rect width="180" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="20" cy="18" r="5" fill="#a855f7" />
        <text x="34" y="23" class="tag-text">Strict Free Tier Limits</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(575, 0)">
        <rect width="180" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="20" cy="18" r="5" fill="#f59e0b" />
        <text x="34" y="23" class="tag-text">Verified Open-Source</text>
      </g>
    </g>
  </g>
</svg>
