<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glowGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".3"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><linearGradient id="glowGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".25"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".8" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity=".3"/></pattern><style>@keyframes floatOrb1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-25px) scale(1.1)}}@keyframes floatOrb2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,20px) scale(1.15)}}@keyframes pulseBeam{0%{stroke-dashoffset:0;opacity:.8}50%{stroke-dashoffset:-40;opacity:.3}}@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes signalRing{0%{r:6px;opacity:.9}}.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.gradient-title{fill:url(#accentGrad)}.node-text,.subtitle-text,.tag-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:400;font-size:18px;fill:#94a3b8;letter-spacing:.2px}.node-text,.tag-text{font-weight:600}.tag-text{font-size:13px;fill:#e2e8f0}.node-text{font-size:12px;fill:#38bdf8}.floating-orb-1{animation:floatOrb1 9s ease-in-out infinite}.floating-orb-2{animation:floatOrb2 11s ease-in-out infinite}.dynamic-beam{stroke-dasharray:8,8;animation:pulseBeam 4s linear infinite}.pulsing-ring{animation:signalRing 2.5s cubic-bezier(.2,.8,.2,1) infinite}.pulsing-ring-delay{animation:signalRing 2.5s cubic-bezier(.2,.8,.2,1) infinite 1.25s}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)"/><g class="floating-orb-1"><circle cx="200" cy="100" r="180" fill="url(#glowGrad1)"/></g><g class="floating-orb-2"><circle cx="1020" cy="300" r="220" fill="url(#glowGrad2)"/></g><rect width="1200" height="420" fill="url(#grid)"/><g opacity=".65"><path fill="none" stroke="#334155" stroke-width="2" d="M 860 120 L 980 80 L 1080 160 L 990 260 L 860 120"/><path fill="none" stroke="#334155" stroke-width="1.5" d="M 980 80 L 990 260"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 860 120 L 980 80" class="dynamic-beam"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 980 80 L 1080 160" class="dynamic-beam"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M 1080 160 L 990 260" class="dynamic-beam"/><circle cx="1080" cy="160" r="6" fill="#38bdf8"/><circle cx="1080" cy="160" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" class="pulsing-ring"/><circle cx="1080" cy="160" r="12" fill="none" stroke="#818cf8" stroke-width="1.5" class="pulsing-ring-delay"/><circle cx="860" cy="120" r="5" fill="#818cf8"/><circle cx="980" cy="80" r="5" fill="#38bdf8"/><circle cx="990" cy="260" r="5" fill="#c084fc"/><rect width="110" height="24" x="805" y="132" fill="#0f172a" stroke="#334155" stroke-width="1" rx="12"/><text x="860" y="148" class="node-text" text-anchor="middle">Partner Org</text><rect width="110" height="24" x="925" y="44" fill="#0f172a" stroke="#334155" stroke-width="1" rx="12"/><text x="980" y="60" class="node-text" text-anchor="middle">Secure VDR</text><rect width="100" height="24" x="1035" y="180" fill="#0f172a" stroke="#38bdf8" stroke-width="1" rx="12"/><text x="1085" y="196" fill="#38bdf8" class="node-text" text-anchor="middle">Portal Hub</text><rect width="110" height="24" x="935" y="275" fill="#0f172a" stroke="#334155" stroke-width="1" rx="12"/><text x="990" y="291" class="node-text" text-anchor="middle">Enterprise API</text></g><g><g transform="translate(80, 0) translate(0, 75)"><rect width="260" height="32" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".8" stroke-width="1" rx="16"/><circle cx="16" cy="16" r="4" fill="#38bdf8"/><text x="30" y="21" fill="#38bdf8" class="tag-text">CURATED AWESOME DIRECTORY</text></g><text x="0" y="165" class="title-text" transform="translate(80, 0)">Awesome <tspan class="gradient-title">B2B Partner Collaboration</tspan></text><text x="0" y="215" class="title-text" transform="translate(80, 0)">Workspaces &amp; Client Portals</text><text x="0" y="260" class="subtitle-text" transform="translate(80, 0)">The definitive index of external collaboration spaces, shared channel platforms,</text><text x="0" y="286" class="subtitle-text" transform="translate(80, 0)">and self-hosted open-source client portal software.</text><g><g transform="translate(80, 0) translate(0, 325) translate(0, 0)"><rect width="170" height="36" fill="#1e293b" stroke="#475569" stroke-width="1" rx="18"/><circle cx="20" cy="18" r="5" fill="#10b981"/><text x="34" y="23" class="tag-text">SaaS Market Cap</text></g><g transform="translate(80, 0) translate(0, 325) translate(185, 0)"><rect width="180" height="36" fill="#1e293b" stroke="#475569" stroke-width="1" rx="18"/><circle cx="20" cy="18" r="5" fill="#38bdf8"/><text x="34" y="23" class="tag-text">Transparent Pricing</text></g><g transform="translate(80, 0) translate(0, 325) translate(380, 0)"><rect width="180" height="36" fill="#1e293b" stroke="#475569" stroke-width="1" rx="18"/><circle cx="20" cy="18" r="5" fill="#a855f7"/><text x="34" y="23" class="tag-text">Strict Free Tier Limits</text></g><g transform="translate(80, 0) translate(0, 325) translate(575, 0)"><rect width="180" height="36" fill="#1e293b" stroke="#475569" stroke-width="1" rx="18"/><circle cx="20" cy="18" r="5" fill="#f59e0b"/><text x="34" y="23" class="tag-text">Verified Open-Source</text></g></g></g></svg>